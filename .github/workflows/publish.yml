on:
  push:
    tags:
      - "*"

name: Deploy Extension
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2 
        with: 
          bun-version: latest # or "latest", "canary", "1.3.x"
      - run: bun ci
      - run: bunx @vscode/vsce publish --oidc
